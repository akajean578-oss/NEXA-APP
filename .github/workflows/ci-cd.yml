name: CI/CD Nexa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Tests backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Lancer les tests (unitaires + intégration)
        run: mvn -B test

  frontend-tests:
    name: Tests frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests de composants (Vitest)
        run: npm run test
      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium
      # Les tests e2e nécessitent le backend démarré ; à activer une fois
      # un environnement de test complet mis en place dans la CI.
      # - name: Tests end-to-end (Playwright)
      #   run: npm run test:e2e

  build-and-push-images:
    name: Build & push des images Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Connexion au registre de conteneurs
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/nexa-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/nexa-frontend:latest

      # Étape suivante typique : déclencher un déploiement sur Railway/Render/AWS
      # via leur CLI ou un webhook, en utilisant les images tout juste publiées.
