# ==== Profil "prod" : utilisé en conteneur (docker-compose) ou en hébergement cloud ====
# Toutes les valeurs sensibles viennent de variables d'environnement, jamais du code.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

server.port=8080

nexa.jwt.secret=${NEXA_JWT_SECRET}
nexa.jwt.expiration-ms=${NEXA_JWT_EXPIRATION_MS:86400000}

nexa.upload.dir=${NEXA_UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ==== Cache Redis (fil d'actualité) ====
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=30000
