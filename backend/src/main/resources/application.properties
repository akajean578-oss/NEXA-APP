# ==== Base de donnees ====
# Par defaut : H2 en memoire, pratique pour demarrer sans rien installer.
# Pour passer en PostgreSQL (recommande en production), commente le bloc H2
# et decommente le bloc PostgreSQL plus bas.

spring.datasource.url=jdbc:h2:mem:nexadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- PostgreSQL (production) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/nexa
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=nexa_user
# spring.datasource.password=change_me

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ==== Upload de medias ====
nexa.upload.dir=uploads
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ==== JWT ====
# IMPORTANT : change cette valeur avant tout deploiement reel (secret long et aleatoire).
nexa.jwt.secret=changeThisSecretKeyForProductionUseSomethingLongAndRandom123456
nexa.jwt.expiration-ms=86400000
