version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexa
      POSTGRES_USER: nexa_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - nexa-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa_user -d nexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa
      SPRING_DATASOURCE_USERNAME: nexa_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change_me}
      SPRING_REDIS_HOST: redis
      NEXA_JWT_SECRET: ${JWT_SECRET:?une valeur JWT_SECRET est requise}
      NEXA_UPLOAD_DIR: /app/uploads
    volumes:
      - nexa-uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  nexa-db-data:
  nexa-uploads:
